name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # arm64 Apple Silicon runner
            target: aarch64-apple-darwin
            artifact: genetui-macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: genetui-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install htslib (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install htslib pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix htslib)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install htslib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libbz2-dev liblzma-dev \
            libcurl4-openssl-dev libssl-dev zlib1g-dev
          # Build htslib from source — libhtslib-dev is not reliably available on ubuntu-24.04
          curl -fsSL https://github.com/samtools/htslib/releases/download/1.21/htslib-1.21.tar.bz2 \
            | tar -xj
          cd htslib-1.21
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        run: |
          BINARY=target/${{ matrix.target }}/release/genetui
          strip "$BINARY" || true
          tar czf ${{ matrix.artifact }}.tar.gz -C "$(dirname $BINARY)" genetui
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256
